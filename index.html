```html
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OFFLINE NAUKRI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#222;
}

/* HEADER */
.header{
    background:#0756a3;
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#ffd600;
}

.admin-button{
    background:#ff9800;
    color:white;
    border:0;
    padding:12px 18px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.admin-button:hover{
    background:#e68900;
}

/* HERO */
.hero{
    background:white;
    text-align:center;
    padding:30px 15px;
}

.hero h1{
    margin:0 0 8px;
    color:#0756a3;
}

.hero p{
    margin:0;
    color:#666;
}

/* SEARCH */
.search-area{
    max-width:700px;
    margin:20px auto;
    padding:0 15px;
}

.search{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

/* CONTENT */
.container{
    width:94%;
    max-width:1200px;
    margin:auto;
}

.job-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.job{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    border-top:4px solid #0756a3;
}

.job h2{
    margin:0 0 8px;
    color:#0756a3;
    font-size:21px;
}

.job p{
    line-height:1.7;
    margin:5px 0;
}

.tag{
    display:inline-block;
    background:#e3f2fd;
    color:#0756a3;
    padding:5px 9px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
    margin-top:5px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:15px;
}

.btn{
    border:0;
    padding:9px 12px;
    border-radius:6px;
    color:white;
    text-decoration:none;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
}

.details{
    background:#0756a3;
}

.notification{
    background:#d32f2f;
}

.form{
    background:#2e7d32;
}

.empty{
    background:white;
    padding:40px;
    text-align:center;
    border-radius:10px;
}

/* ADMIN */
#adminArea{
    display:none;
    background:white;
    width:94%;
    max-width:1000px;
    margin:25px auto;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.admin-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding-bottom:15px;
    margin-bottom:20px;
}

.admin-title h2{
    color:#0756a3;
    margin:0;
}

.close{
    background:#d32f2f;
    color:white;
    border:0;
    padding:9px 14px;
    border-radius:6px;
    cursor:pointer;
}

/* ADMIN FORM */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-weight:bold;
    margin-bottom:5px;
}

.field input,
.field textarea,
.field select{
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

.field textarea{
    min-height:90px;
}

.full{
    grid-column:1 / -1;
}

.save{
    background:#2e7d32;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    margin-top:15px;
}

.clear{
    background:#777;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    margin-top:15px;
}

/* ADMIN JOBS */
.manage{
    margin-top:30px;
}

.manage-item{
    background:#f1f5f9;
    padding:12px;
    margin:8px 0;
    border-radius:7px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.edit{
    background:#f57c00;
    color:white;
    border:0;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

.delete{
    background:#d32f2f;
    color:white;
    border:0;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

/* LOGIN */
#loginBox{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.7);
}

.login{
    background:white;
    width:90%;
    max-width:400px;
    margin:100px auto;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

.login h2{
    color:#0756a3;
}

.login input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:6px;
    margin:10px 0;
}

.login button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.login-button{
    background:#0756a3;
    color:white;
}

.cancel-button{
    background:#ddd;
    margin-top:8px;
}

#error{
    color:red;
    margin-top:10px;
}

/* FOOTER */
footer{
    background:#0756a3;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

@media(max-width:650px){

    .header{
        flex-direction:column;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .manage-item{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        OFFLINE <span>NAUKRI</span>
    </div>

    <!-- YE ADMIN BUTTON HAMESHA DIKHEGA -->
    <button class="admin-button" onclick="openLogin()">
        🔐 ADMIN LOGIN
    </button>

</div>


<!-- HERO -->

<div class="hero">

    <h1>OFFLINE NAUKRI</h1>

    <p>
        Latest Offline Vacancy & Government Job Updates
    </p>

</div>


<!-- SEARCH -->

<div class="search-area">

    <input
        class="search"
        id="search"
        type="text"
        placeholder="🔎 Vacancy search karein..."
        onkeyup="searchJobs()"
    >

</div>


<!-- PUBLIC JOBS -->

<div class="container">

    <div id="jobList" class="job-list"></div>

</div>


<!-- ========================= -->
<!-- LOGIN POPUP -->
<!-- ========================= -->

<div id="loginBox">

    <div class="login">

        <h2>🔐 Admin Login</h2>

        <p>Admin Panel open karne ke liye PIN dalein</p>

        <input
            type="password"
            id="pin"
            placeholder="Enter PIN"
        >

        <button
            class="login-button"
            onclick="login()"
        >
            LOGIN
        </button>

        <button
            class="cancel-button"
            onclick="closeLogin()"
        >
            CANCEL
        </button>

        <div id="error"></div>

    </div>

</div>


<!-- ========================= -->
<!-- ADMIN AREA -->
<!-- ========================= -->

<div id="adminArea">

    <div class="admin-title">

        <h2>⚙️ ADMIN PANEL</h2>

        <button
            class="close"
            onclick="closeAdmin()"
        >
            ✕ CLOSE
        </button>

    </div>


    <h3 id="formHeading">
        ➕ Add New Vacancy
    </h3>


    <div class="form-grid">

        <div class="field">

            <label>Post Name *</label>

            <input
                id="post"
                placeholder="Example: Peon"
            >

        </div>


        <div class="field">

            <label>Department *</label>

            <input
                id="department"
                placeholder="Example: Haryana Govt"
            >

        </div>


        <div class="field">

            <label>Total Posts</label>

            <input
                id="posts"
                placeholder="100"
            >

        </div>


        <div class="field">

            <label>Qualification</label>

            <input
                id="qualification"
                placeholder="10th / 12th / Graduate"
            >

        </div>


        <div class="field">

            <label>Age Limit</label>

            <input
                id="age"
                placeholder="18-42 Years"
            >

        </div>


        <div class="field">

            <label>Application Fee</label>

            <input
                id="fee"
                placeholder="₹0"
            >

        </div>


        <div class="field">

            <label>Start Date</label>

            <input
                id="start"
                type="date"
            >

        </div>


        <div class="field">

            <label>Last Date</label>

            <input
                id="last"
                type="date"
            >

        </div>


        <div class="field">

            <label>Selection Process</label>

            <input
                id="selection"
                placeholder="Merit / Interview / Exam"
            >

        </div>


        <div class="field">

            <label>Apply Mode</label>

            <select id="mode">

                <option>Offline</option>

                <option>Online</option>

            </select>

        </div>


        <div class="field full">

            <label>Form Send Address</label>

            <textarea
                id="address"
                placeholder="Application form kis address par bhejna hai?"
            ></textarea>

        </div>


        <div class="field full">

            <label>Official Notification Link</label>

            <input
                id="notification"
                placeholder="https://example.com/notification.pdf"
            >

        </div>


        <div class="field full">

            <label>Application Form Link</label>

            <input
                id="application"
                placeholder="https://example.com/form.pdf"
            >

        </div>


        <div class="field full">

            <label>Full Details</label>

            <textarea
                id="details"
                placeholder="Vacancy ki complete information..."
            ></textarea>

        </div>

    </div>


    <button
        class="save"
        onclick="saveJob()"
    >
        💾 SAVE VACANCY
    </button>


    <button
        class="clear"
        onclick="clearForm()"
    >
        CLEAR
    </button>


    <!-- MANAGE -->

    <div class="manage">

        <h3>📋 Manage Vacancies</h3>

        <div id="manageList"></div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    © 2026 OFFLINE NAUKRI

</footer>


<script>

/* ==============================
   ADMIN PIN
============================== */

const ADMIN_PIN = "1234";


/* ==============================
   EDIT VARIABLE
============================== */

let editId = null;


/* ==============================
   LOAD JOBS
============================== */

let jobs = JSON.parse(
    localStorage.getItem("OFFLINE_NAUKRI_JOBS")
) || [];


/* ==============================
   LOGIN POPUP
============================== */

function openLogin(){

    document.getElementById("loginBox").style.display = "block";

    document.getElementById("pin").value = "";

    document.getElementById("error").innerText = "";

}


function closeLogin(){

    document.getElementById("loginBox").style.display = "none";

}


/* ==============================
   LOGIN
============================== */

function login(){

    let pin =
        document.getElementById("pin").value;

    if(pin === ADMIN_PIN){

        closeLogin();

        document.getElementById("adminArea").style.display = "block";

        displayManage();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        document.getElementById("error").innerText =
            "❌ Wrong PIN. PIN 1234 hai.";

    }

}


/* ==============================
   CLOSE ADMIN
============================== */

function closeAdmin(){

    document.getElementById("adminArea").style.display = "none";

}


/* ==============================
   SAVE JOB
============================== */

function saveJob(){

    let job = {

        post:
            document.getElementById("post").value.trim(),

        department:
            document.getElementById("department").value.trim(),

        posts:
            document.getElementById("posts").value.trim(),

        qualification:
            document.getElementById("qualification").value.trim(),

        age:
            document.getElementById("age").value.trim(),

        fee:
            document.getElementById("fee").value.trim(),

        start:
            document.getElementById("start").value,

        last:
            document.getElementById("last").value,

        selection:
            document.getElementById("selection").value.trim(),

        mode:
            document.getElementById("mode").value,

        address:
            document.getElementById("address").value.trim(),

        notification:
            document.getElementById("notification").value.trim(),

        application:
            document.getElementById("application").value.trim(),

        details:
            document.getElementById("details").value.trim()

    };


    if(!job.post || !job.department){

        alert("Post Name aur Department bharna zaroori hai.");

        return;

    }


    if(editId === null){

        jobs.unshift(job);

        alert("✅ Vacancy Added Successfully!");

    }else{

        jobs[editId] = job;

        editId = null;

        document.getElementById("formHeading").innerText =
            "➕ Add New Vacancy";

        alert("✅ Vacancy Updated Successfully!");

    }


    localStorage.setItem(
        "OFFLINE_NAUKRI_JOBS",
        JSON.stringify(jobs)
    );


    clearForm();

    displayJobs();

    displayManage();

}


/* ==============================
   DISPLAY PUBLIC JOBS
============================== */

function displayJobs(list = jobs){

    let box =
        document.getElementById("jobList");


    if(list.length === 0){

        box.innerHTML = `

            <div class="empty">

                <h2>📭 अभी कोई vacancy नहीं है</h2>

                <p>
                    Admin Panel से पहली vacancy add करें।
                </p>

            </div>

        `;

        return;

    }


    box.innerHTML = list.map((job,index)=>`

        <div class="job">

            <h2>
                ${escapeText(job.post)}
            </h2>

            <p>
                🏢 <b>${escapeText(job.department)}</b>
            </p>

            <span class="tag">
                ${escapeText(job.mode)}
            </span>

            <p>
                📌 <b>Total Posts:</b>
                ${escapeText(job.posts || "-")}
            </p>

            <p>
                🎓 <b>Qualification:</b>
                ${escapeText(job.qualification || "-")}
            </p>

            <p>
                🎂 <b>Age:</b>
                ${escapeText(job.age || "-")}
            </p>

            <p>
                📅 <b>Last Date:</b>
                ${formatDate(job.last)}
            </p>


            <div class="buttons">

                <button
                    class="btn details"
                    onclick="showDetails(${index})"
                >
                    👁 Details
                </button>


                ${
                    job.notification
                    ?
                    `<a
                        class="btn notification"
                        href="${job.notification}"
                        target="_blank"
                    >
                        📄 Notification
                    </a>`
                    :
                    ""
                }


                ${
                    job.application
                    ?
                    `<a
                        class="btn form"
                        href="${job.application}"
                        target="_blank"
                    >
                        📝 Application Form
                    </a>`
                    :
                    ""
                }

            </div>

        </div>

    `).join("");

}


/* ==============================
   DETAILS
============================== */

function showDetails(index){

    let j = jobs[index];

    alert(

        "POST: " + j.post +

        "\n\nDEPARTMENT: " + j.department +

        "\n\nTOTAL POSTS: " + j.posts +

        "\n\nQUALIFICATION: " + j.qualification +

        "\n\nAGE LIMIT: " + j.age +

        "\n\nSTART DATE: " + formatDate(j.start) +

        "\n\nLAST DATE: " + formatDate(j.last) +

        "\n\nFEE: " + j.fee +

        "\n\nSELECTION: " + j.selection +

        "\n\nAPPLY MODE: " + j.mode +

        "\n\nFORM SEND ADDRESS:\n" +
        j.address +

        "\n\nDETAILS:\n" +
        j.details

    );

}


/* ==============================
   MANAGE LIST
============================== */

function displayManage(){

    let box =
        document.getElementById("manageList");


    if(jobs.length === 0){

        box.innerHTML =
            "<p>अभी कोई vacancy add नहीं हुई है।</p>";

        return;

    }


    box.innerHTML = jobs.map((job,index)=>`

        <div class="manage-item">

            <div>

                <b>
                    ${escapeText(job.post)}
                </b>

                <br>

                <small>
                    ${escapeText(job.department)}
                </small>

            </div>


            <div>

                <button
                    class="edit"
                    onclick="editJob(${index})"
                >
                    ✏️ EDIT
                </button>

                <button
                    class="delete"
                    onclick="deleteJob(${index})"
                >
                    🗑️ DELETE
                </button>

            </div>

        </div>

    `).join("");

}


/* ==============================
   EDIT
============================== */

function editJob(index){

    let j = jobs[index];

    editId = index;


    document.getElementById("formHeading").innerText =
        "✏️ Edit Vacancy";


    document.getElementById("post").value =
        j.post || "";

    document.getElementById("department").value =
        j.department || "";

    document.getElementById("posts").value =
        j.posts || "";

    document.getElementById("qualification").value =
        j.qualification || "";

    document.getElementById("age").value =
        j.age || "";

    document.getElementById("fee").value =
        j.fee || "";

    document.getElementById("start").value =
        j.start || "";

    document.getElementById("last").value =
        j.last || "";

    document.getElementById("selection").value =
        j.selection || "";

    document.getElementById("mode").value =
        j.mode || "Offline";

    document.getElementById("address").value =
        j.address || "";

    document.getElementById("notification").value =
        j.notification || "";

    document.getElementById("application").value =
        j.application || "";

    document.getElementById("details").value =
        j.details || "";


    document.getElementById("adminArea")
        .scrollIntoView({
            behavior:"smooth"
        });

}


/* ==============================
   DELETE
============================== */

function deleteJob(index){

    if(
        !confirm(
            "Kya aap is vacancy ko delete karna chahte hain?"
        )
    ){

        return;

    }


    jobs.splice(index,1);


    localStorage.setItem(
        "OFFLINE_NAUKRI_JOBS",
        JSON.stringify(jobs)
    );


    displayJobs();

    displayManage();

}


/* ==============================
   CLEAR FORM
============================== */

function clearForm(){

    editId = null;


    document.getElementById("formHeading").innerText =
        "➕ Add New Vacancy";


    document.getElementById("post").value = "";

    document.getElementById("department").value = "";

    document.getElementById("posts").value = "";

    document.getElementById("qualification").value = "";

    document.getElementById("age").value = "";

    document.getElementById("fee").value = "";

    document.getElementById("start").value = "";

    document.getElementById("last").value = "";

    document.getElementById("selection").value = "";

    document.getElementById("mode").value = "Offline";

    document.getElementById("address").value = "";

    document.getElementById("notification").value = "";

    document.getElementById("application").value = "";

    document.getElementById("details").value = "";

}


/* ==============================
   SEARCH
============================== */

function searchJobs(){

    let q =
        document.getElementById("search")
        .value
        .toLowerCase();


    let result =
        jobs.filter(job =>
            JSON.stringify(job)
            .toLowerCase()
            .includes(q)
        );


    displayJobs(result);

}


/* ==============================
   DATE
============================== */

function formatDate(date){

    if(!date){
        return "-";
    }

    let d = new Date(date);

    if(isNaN(d)){
        return date;
    }

    return d.toLocaleDateString("en-IN");

}


/* ==============================
   SAFE TEXT
============================== */

function escapeText(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==============================
   START
============================== */

displayJobs();

</script>

</body>
</html>
```
