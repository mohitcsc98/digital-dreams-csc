```html
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Dreams CSC - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
}

header{
  background:#8b0000;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  max-width:900px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:8px;
  box-shadow:0 2px 8px #ccc;
}

h2{
  margin-bottom:15px;
  color:#8b0000;
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:5px;
}

textarea{
  min-height:120px;
}

button{
  padding:12px 20px;
  background:#8b0000;
  color:white;
  border:0;
  border-radius:5px;
  cursor:pointer;
  margin-top:8px;
}

button:hover{
  background:#600000;
}

.logout{
  background:#222;
  float:right;
}

.delete{
  background:#d00000;
}

.edit{
  background:#1565c0;
}

#adminPanel{
  display:none;
}

.post{
  border:1px solid #ddd;
  padding:15px;
  margin:10px 0;
  border-radius:5px;
}

.post h3{
  margin-bottom:5px;
}

.message{
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>Digital Dreams CSC</h1>
<p>Firebase Admin Panel</p>
</header>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

<h2>🔐 Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="adminLogin()">
Login
</button>

<p class="message" id="loginMessage"></p>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel">

<div class="card">

<button class="logout" onclick="logout()">
Logout
</button>

<h2>Admin Dashboard</h2>

<p>
यहां से Digital Dreams CSC की updates manage करें।
</p>

</div>


<!-- ADD / EDIT POST -->

<div class="card">

<h2 id="formHeading">
➕ New Update Add करें
</h2>

<input
type="hidden"
id="editId">

<label>Category</label>

<select id="category">

<option value="jobs">
Latest Jobs
</option>

<option value="results">
Results
</option>

<option value="admit-card">
Admit Card
</option>

<option value="answer-key">
Answer Key
</option>

<option value="haryana">
Haryana Updates
</option>

<option value="csc">
CSC Services
</option>

<option value="notice">
Latest Notice
</option>

</select>


<label>Title</label>

<input
type="text"
id="title"
placeholder="जैसे: Haryana Police Vacancy 2026">


<label>Description</label>

<textarea
id="description"
placeholder="Update की पूरी जानकारी लिखें"></textarea>


<label>Official / Apply Link</label>

<input
type="url"
id="link"
placeholder="https://example.com">


<button onclick="savePost()">
💾 Save Update
</button>

<button
type="button"
onclick="resetForm()"
style="background:#555;">
Clear
</button>

<p id="saveMessage" class="message"></p>

</div>


<!-- ALL POSTS -->

<div class="card">

<h2>📋 All Updates</h2>

<div id="postList">
Loading...
</div>

</div>

</div>

</div>


<!-- FIREBASE -->

<script type="module">

/*
=================================================
IMPORTANT

नीचे YOUR_... वाली values को अपने Firebase
Project की firebaseConfig values से बदलना है.
=================================================
*/


import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";



const firebaseConfig = {

apiKey:
"YOUR_API_KEY",

authDomain:
"YOUR_PROJECT.firebaseapp.com",

projectId:
"YOUR_PROJECT_ID",

storageBucket:
"YOUR_PROJECT.firebasestorage.app",

messagingSenderId:
"YOUR_SENDER_ID",

appId:
"YOUR_APP_ID"

};



const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);



const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const loginMessage =
document.getElementById("loginMessage");

const saveMessage =
document.getElementById("saveMessage");



/* ==========================
LOGIN
========================== */

window.adminLogin =
async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;


if(!email || !password){

loginMessage.innerText =
"Email और Password डालें.";

return;

}


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

loginMessage.innerText =
"Login Successful";

}
catch(error){

console.error(error);

loginMessage.innerText =
"Login Failed: " + error.message;

}

};



/* ==========================
LOGOUT
========================== */

window.logout =
async function(){

await signOut(auth);

};



/* ==========================
AUTH STATUS
========================== */

onAuthStateChanged(
auth,
function(user){

if(user){

loginBox.style.display =
"none";

adminPanel.style.display =
"block";

loadPosts();

}
else{

loginBox.style.display =
"block";

adminPanel.style.display =
"none";

}

});



/* ==========================
SAVE / UPDATE POST
========================== */

window.savePost =
async function(){

const editId =
document.getElementById("editId").value;

const category =
document.getElementById("category").value;

const title =
document.getElementById("title").value.trim();

const description =
document.getElementById("description").value.trim();

const link =
document.getElementById("link").value.trim();


if(!title){

saveMessage.innerText =
"Title डालना जरूरी है.";

return;

}


const data = {

category:category,

title:title,

description:description,

link:link,

updatedAt:
serverTimestamp()

};


try{


if(editId){

await updateDoc(
doc(db,"posts",editId),
data
);

saveMessage.innerText =
"Update successfully edited.";

}
else{

data.createdAt =
serverTimestamp();

await addDoc(
collection(db,"posts"),
data
);

saveMessage.innerText =
"New update successfully added.";

}


resetForm();

loadPosts();


}
catch(error){

console.error(error);

saveMessage.innerText =
"Error: " + error.message;

}

};



/* ==========================
LOAD POSTS
========================== */

async function loadPosts(){

const postList =
document.getElementById("postList");

postList.innerHTML =
"Loading...";


try{

const snapshot =
await getDocs(
collection(db,"posts")
);


postList.innerHTML =
"";


if(snapshot.empty){

postList.innerHTML =
"<p>अभी कोई update नहीं है.</p>";

return;

}


snapshot.forEach(function(item){

const data =
item.data();


const div =
document.createElement("div");

div.className =
"post";


const title =
document.createElement("h3");

title.textContent =
data.title || "No Title";


const category =
document.createElement("p");

category.textContent =
"Category: " +
(data.category || "");


const description =
document.createElement("p");

description.textContent =
data.description || "";


const editButton =
document.createElement("button");

editButton.className =
"edit";

editButton.textContent =
"✏️ Edit";


editButton.onclick =
function(){

startEdit(
item.id,
data
);

};


const deleteButton =
document.createElement("button");

deleteButton.className =
"delete";

deleteButton.textContent =
"🗑 Delete";


deleteButton.onclick =
function(){

deletePost(
item.id
);

};


div.appendChild(title);
div.appendChild(category);
div.appendChild(description);
div.appendChild(editButton);
div.appendChild(deleteButton);

postList.appendChild(div);

});

}
catch(error){

console.error(error);

postList.innerHTML =
"Posts load नहीं हो पाए: " +
error.message;

}

}



/* ==========================
EDIT
========================== */

function startEdit(id,data){

document.getElementById(
"editId"
).value = id;


document.getElementById(
"category"
).value =
data.category || "jobs";


document.getElementById(
"title"
).value =
data.title || "";


document.getElementById(
"description"
).value =
data.description || "";


document.getElementById(
"link"
).value =
data.link || "";


document.getElementById(
"formHeading"
).innerText =
"✏️ Update Edit करें";


window.scrollTo({
top:0,
behavior:"smooth"
});

}



/* ==========================
DELETE
========================== */

async function deletePost(id){

const confirmDelete =
confirm(
"क्या आप यह update delete करना चाहते हैं?"
);


if(!confirmDelete){
return;
}


try{

await deleteDoc(
doc(db,"posts",id)
);

loadPosts();

}
catch(error){

alert(
"Delete Error: " +
error.message
);

}

}



/* ==========================
RESET FORM
========================== */

window.resetForm =
function(){

document.getElementById(
"editId"
).value = "";


document.getElementById(
"title"
).value = "";


document.getElementById(
"description"
).value = "";


document.getElementById(
"link"
).value = "";


document.getElementById(
"formHeading"
).innerText =
"➕ New Update Add करें";

};

</script>

</body>
</html>
```
