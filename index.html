<!DOCTYPE html>

<style>
*{
    box-sizing:border-box;

body{

}

}

    background:#e53935;

footer{
    background:#0d47a1;

}

    header{
        justify-content:center;
        text-align:center;
    }

    .logo{
        font-size:24px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .admin-item{
        flex-direction:column;
        align-items:flex-start;
    }

</style>
</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo">
        OFFLINE <span>NAUKRI</span>
    </div>

    <button class="admin-btn" onclick="openAdmin()">
        🔐 Admin Panel
    </button>

</header>

<!-- HERO -->
<section class="hero">

    <h1>OFFLINE NAUKRI</h1>

    <p>
        Latest Offline Vacancy, Government Job & Application Form Updates
    </p>

</section>

<!-- SEARCH -->
<div class="search-box">

    <input
        type="text"
        id="search"
        placeholder="🔎 Vacancy, Department, Qualification search karein..."
        onkeyup="searchJobs()"
    >

</div>

<!-- JOBS -->
<div class="container">

    <div id="jobs" class="jobs"></div>

</div>

<!-- ADMIN OVERLAY -->
<div id="adminOverlay" class="admin-overlay">

    <!-- LOGIN -->
    <div id="loginBox" class="login-box">

        <h2>🔐 Admin Login</h2>

        <input
            type="password"
            id="adminPin"
            class="input"
            placeholder="Admin PIN"
        >

        <button class="login-btn" onclick="loginAdmin()">
            Login
        </button>

        <div id="loginError" class="error"></div>

        <br>

        <button
            onclick="closeAdmin()"
            style="width:100%;padding:10px;border:0;border-radius:7px;cursor:pointer;"
        >
            Close
        </button>

    </div>


    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="admin-box" style="display:none;">

        <div class="admin-header">

            <h2>⚙️ Admin Panel</h2>

            <button class="close-btn" onclick="closeAdmin()">
                ✕ Close
            </button>

        </div>


        <h3 id="formTitle">➕ Add New Vacancy</h3>

        <br>

        <div class="form-grid">

            <div class="form-group">
                <label>Post Name *</label>
                <input id="postName" class="input" placeholder="Peon / Clerk / Helper">
            </div>

            <div class="form-group">
                <label>Department / Organization *</label>
                <input id="department" class="input" placeholder="Department Name">
            </div>

            <div class="form-group">
                <label>Total Posts</label>
                <input id="totalPosts" class="input" placeholder="100">
            </div>

            <div class="form-group">
                <label>Qualification</label>
                <input id="qualification" class="input" placeholder="10th Pass / 12th Pass">
            </div>

            <div class="form-group">
                <label>Age Limit</label>
                <input id="ageLimit" class="input" placeholder="18-42 Years">
            </div>

            <div class="form-group">
                <label>Start Date</label>
                <input id="startDate" class="input" type="date">
            </div>

            <div class="form-group">
                <label>Last Date</label>
                <input id="lastDate" class="input" type="date">
            </div>

            <div class="form-group">
                <label>Application Fee</label>
                <input id="fee" class="input" placeholder="₹0 / ₹100 / As per rules">
            </div>

            <div class="form-group">
                <label>Selection Process</label>
                <input id="selection" class="input" placeholder="Merit / Interview / Test">
            </div>

            <div class="form-group">
                <label>Apply Mode</label>

                <select id="applyMode" class="input">

                    <option value="Offline">
                        Offline
                    </option>

                    <option value="Online">
                        Online
                    </option>

                </select>

            </div>

            <div class="form-group full">

                <label>Form Send Address</label>

                <textarea
                    id="sendAddress"
                    placeholder="Application form kis address par bhejna hai..."
                ></textarea>

            </div>

            <div class="form-group full">

                <label>Official Notification PDF Link</label>

                <input
                    id="notification"
                    class="input"
                    placeholder="https://example.com/notification.pdf"
                >

            </div>

            <div class="form-group full">

                <label>Application Form PDF Link</label>

                <input
                    id="applicationForm"
                    class="input"
                    placeholder="https://example.com/application-form.pdf"
                >

            </div>

            <div class="form-group full">

                <label>Full Vacancy Details</label>

                <textarea
                    id="details"
                    placeholder="Vacancy ki complete information..."
                ></textarea>

            </div>

        </div>

        <button class="save-btn" onclick="saveJob()">
            💾 Save Vacancy
        </button>

        <button
            onclick="clearForm()"
            style="margin-top:15px;padding:13px 20px;border:0;border-radius:7px;cursor:pointer;"
        >
            Clear
        </button>


        <!-- ADMIN LIST -->

        <div class="admin-list">

            <h3>📋 Manage Vacancies</h3>

            <br>

            <div id="adminJobs"></div>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    <p>© 2026 OFFLINE NAUKRI | All Rights Reserved</p>

</footer>


<script>

/* =========================
   ADMIN SETTINGS
========================= */

const ADMIN_PIN = "1234";

let editIndex = -1;


/* =========================
   DEFAULT JOB DATA
========================= */

let jobs = JSON.parse(
    localStorage.getItem("offlineNaukriJobs")
) || [

    {
        postName:"Example Peon Vacancy",
        department:"Sample Department",
        totalPosts:"10",
        qualification:"10th Pass",
        ageLimit:"18-40 Years",
        startDate:"2026-10-01",
        lastDate:"2026-10-30",
        fee:"₹0",
        selection:"Merit / Interview",
        applyMode:"Offline",
        sendAddress:"Example Address, Haryana",
        notification:"#",
        applicationForm:"#",
        details:"Ye ek demo vacancy hai. Admin Panel se ise edit ya delete kar sakte hain."
    }

];


/* =========================
   SAVE DATA
========================= */

function saveData(){

    localStorage.setItem(
        "offlineNaukriJobs",
        JSON.stringify(jobs)
    );

}


/* =========================
   DISPLAY JOBS
========================= */

function displayJobs(list = jobs){

    const container = document.getElementById("jobs");

    if(list.length === 0){

        container.innerHTML = `
            <div class="no-jobs">
                <h3>❌ Koi vacancy nahi mili</h3>
                <p>Search dobara try karein.</p>
            </div>
        `;

        return;

    }


    container.innerHTML = list.map((job,index)=>`

        <div class="job-card">

            <h2>${escapeHTML(job.postName)}</h2>

            <div class="department">
                🏢 ${escapeHTML(job.department)}
            </div>

            <span class="badge">
                📌 ${escapeHTML(job.applyMode || "Offline")}
            </span>

            <div class="info">

                <b>Total Posts:</b>
                ${escapeHTML(job.totalPosts || "-")}
                <br>

                <b>Qualification:</b>
                ${escapeHTML(job.qualification || "-")}
                <br>

                <b>Age:</b>
                ${escapeHTML(job.ageLimit || "-")}
                <br>

                <b>Last Date:</b>
                ${formatDate(job.lastDate)}

            </div>


            <div class="buttons">

                <button
                    class="btn details-btn"
                    onclick="showDetails(${index})"
                >
                    👁 Full Details
                </button>


                ${
                    job.notification && job.notification !== "#"
                    ?
                    `<a
                        class="btn notification-btn"
                        href="${safeURL(job.notification)}"
                        target="_blank"
                    >
                        📄 Notification
                    </a>`
                    :
                    ""
                }


                ${
                    job.applicationForm && job.applicationForm !== "#"
                    ?
                    `<a
                        class="btn form-btn"
                        href="${safeURL(job.applicationForm)}"
                        target="_blank"
                    >
                        📝 Application Form
                    </a>`
                    :
                    ""
                }

            </div>

        </div>

    `).join("");

}


/* =========================
   FULL DETAILS
========================= */

function showDetails(index){

    const job = jobs[index];

    alert(

        "POST: " + job.postName +

        "\n\nDEPARTMENT: " + job.department +

        "\n\nTOTAL POSTS: " + job.totalPosts +

        "\n\nQUALIFICATION: " + job.qualification +

        "\n\nAGE LIMIT: " + job.ageLimit +

        "\n\nSTART DATE: " + formatDate(job.startDate) +

        "\n\nLAST DATE: " + formatDate(job.lastDate) +

        "\n\nAPPLICATION FEE: " + job.fee +

        "\n\nSELECTION: " + job.selection +

        "\n\nAPPLY MODE: " + job.applyMode +

        "\n\nFORM SEND ADDRESS:\n" + job.sendAddress +

        "\n\nDETAILS:\n" + job.details

    );

}


/* =========================
   SEARCH
========================= */

function searchJobs(){

    const value =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filtered = jobs.filter(job =>

        JSON.stringify(job)
        .toLowerCase()
        .includes(value)

    );


    displayJobs(filtered);

}


/* =========================
   OPEN ADMIN
========================= */

function openAdmin(){

    document.getElementById("adminOverlay").style.display="block";

    document.getElementById("loginBox").style.display="block";

    document.getElementById("adminPanel").style.display="none";

    document.getElementById("adminPin").value="";

    document.getElementById("loginError").innerText="";

}


/* =========================
   CLOSE ADMIN
========================= */

function closeAdmin(){

    document.getElementById("adminOverlay").style.display="none";

}


/* =========================
   LOGIN
========================= */

function loginAdmin(){

    const pin =
        document.getElementById("adminPin").value;


    if(pin === ADMIN_PIN){

        document.getElementById("loginBox").style.display="none";

        document.getElementById("adminPanel").style.display="block";

        displayAdminJobs();

    }else{

        document.getElementById("loginError").innerText =
            "❌ Wrong Admin PIN";

    }

}


/* =========================
   SAVE JOB
========================= */

function saveJob(){

    const job = {

        postName: document.getElementById("postName").value.trim(),

        department: document.getElementById("department").value.trim(),

        totalPosts: document.getElementById("totalPosts").value.trim(),

        qualification: document.getElementById("qualification").value.trim(),

        ageLimit: document.getElementById("ageLimit").value.trim(),

        startDate: document.getElementById("startDate").value,

        lastDate: document.getElementById("lastDate").value,

        fee: document.getElementById("fee").value.trim(),

        selection: document.getElementById("selection").value.trim(),

        applyMode: document.getElementById("applyMode").value,

        sendAddress: document.getElementById("sendAddress").value.trim(),

        notification: document.getElementById("notification").value.trim(),

        applicationForm: document.getElementById("applicationForm").value.trim(),

        details: document.getElementById("details").value.trim()

    };


    if(!job.postName || !job.department){

        alert("⚠️ Post Name aur Department bharna zaroori hai.");

        return;

    }


    if(editIndex === -1){

        jobs.unshift(job);

        alert("✅ Vacancy successfully added!");

    }else{

        jobs[editIndex] = job;

        editIndex = -1;

        document.getElementById("formTitle").innerText =
            "➕ Add New Vacancy";

        alert("✅ Vacancy updated successfully!");

    }


    saveData();

    clearForm();

    displayJobs();

    displayAdminJobs();

}


/* =========================
   ADMIN JOB LIST
========================= */

function displayAdminJobs(){

    const box =
        document.getElementById("adminJobs");


    if(jobs.length === 0){

        box.innerHTML =
            "<p>Abhi koi vacancy nahi hai.</p>";

        return;

    }


    box.innerHTML = jobs.map((job,index)=>`

        <div class="admin-item">

            <div>

                <h3>
                    ${escapeHTML(job.postName)}
                </h3>

                <small>
                    ${escapeHTML(job.department)}
                </small>

            </div>


            <div class="admin-actions">

                <button
                    class="edit"
                    onclick="editJob(${index})"
                >
                    ✏️ Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteJob(${index})"
                >
                    🗑️ Delete
                </button>

            </div>

        </div>

    `).join("");

}


/* =========================
   EDIT JOB
========================= */

function editJob(index){

    const job = jobs[index];

    editIndex = index;


    document.getElementById("formTitle").innerText =
        "✏️ Edit Vacancy";


    document.getElementById("postName").value =
        job.postName || "";

    document.getElementById("department").value =
        job.department || "";

    document.getElementById("totalPosts").value =
        job.totalPosts || "";

    document.getElementById("qualification").value =
        job.qualification || "";

    document.getElementById("ageLimit").value =
        job.ageLimit || "";

    document.getElementById("startDate").value =
        job.startDate || "";

    document.getElementById("lastDate").value =
        job.lastDate || "";

    document.getElementById("fee").value =
        job.fee || "";

    document.getElementById("selection").value =
        job.selection || "";

    document.getElementById("applyMode").value =
        job.applyMode || "Offline";

    document.getElementById("sendAddress").value =
        job.sendAddress || "";

    document.getElementById("notification").value =
        job.notification || "";

    document.getElementById("applicationForm").value =
        job.applicationForm || "";

    document.getElementById("details").value =
        job.details || "";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   DELETE JOB
========================= */

function deleteJob(index){

    const confirmDelete =
        confirm(
            "Kya aap is vacancy ko delete karna chahte hain?"
        );


    if(!confirmDelete) return;


    jobs.splice(index,1);

    saveData();

    displayJobs();

    displayAdminJobs();

    alert("🗑️ Vacancy deleted successfully!");

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

    editIndex = -1;


    document.getElementById("formTitle").innerText =
        "➕ Add New Vacancy";


    document.getElementById("postName").value="";
    document.getElementById("department").value="";
    document.getElementById("totalPosts").value="";
    document.getElementById("qualification").value="";
    document.getElementById("ageLimit").value="";
    document.getElementById("startDate").value="";
    document.getElementById("lastDate").value="";
    document.getElementById("fee").value="";
    document.getElementById("selection").value="";
    document.getElementById("applyMode").value="Offline";
    document.getElementById("sendAddress").value="";
    document.getElementById("notification").value="";
    document.getElementById("applicationForm").value="";
    document.getElementById("details").value="";

}


/* =========================
   DATE FORMAT
========================= */

function formatDate(date){

    if(!date) return "-";

    const d = new Date(date);

    if(isNaN(d)) return date;

    return d.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function safeURL(url){

    const value = String(url || "").trim();

    if(
        value.startsWith("https://") ||
        value.startsWith("http://") ||
        value.startsWith("/") ||
        value.startsWith("./")
    ){

        return value;

    }

    return "#";

}


/* =========================
   INITIAL LOAD
========================= */

displayJobs();

</script>

</body>
</html>
